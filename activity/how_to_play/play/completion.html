<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Puzzle Completed!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logo/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logo/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="logo/android-chrome-512x512.png">
    <link rel="manifest" href="/logo/site.webmanifest">
    <style>
        /* Import futuristic fonts */
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@600&family=Orbitron:wght@600&display=swap');

        /* ========== BASE LAYOUT ========== */

                html, body {
            margin: 0;
            padding: 0;
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #0a0018, #1a0033, #320060);
            color: #f0eaff;
        }

        /* ✅ PORTAL SCALE FIX */
        .frame-scale {
            transform: scale(0.9);
            transform-origin: top center;
            width: 100%;
        }

        @media (max-width: 768px) {
            .frame-scale {
                transform: scale(1);
            }
        }

        body {
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* MAIN CONTAINER */
        #container {
            max-width: 640px;
            margin: auto;
            padding: 30px 20px;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: #d580ff;
            text-shadow: 0 0 15px #b44cff;
            margin-bottom: 15px;
        }

        #mode, #stats {
            font-size: 1rem;
            margin: 8px 0;
            color: #e2c8ff;
        }

        #final-image {
            width: clamp(180px, 60%, 260px);
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 0 25px #b44cff;
        }

        #explanation {
            background: rgba(40, 0, 70, 0.8);
            border-left: 5px solid #b44cff;
            border-radius: 12px;
            padding: 15px;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 20px 0;
        }

        #stars {
            font-size: 1.5rem;
            color: gold;
            text-shadow: 0 0 15px #ffdd55;
            margin: 10px 0;
        }

        #credits-btn {
            margin-top: 25px;
            padding: 12px 26px;
            background: linear-gradient(135deg, #b44cff, #5c00b5);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 20px #b44cffaa;
            transition: transform 0.3s ease;
        }

        #credits-btn:hover {
            transform: scale(1.05);
        }

        /* =====================================================
            📱 RESPONSIVE DESIGN
        ====================================================== */

        /* 🔹 Phones (max-width: 600px) */
        @media (max-width: 600px) {
            body {
                padding: 15px;
                justify-content: center;
                /* Center vertically */
            }

            #container {
                width: 95%;
                text-align: center;
            }

            h1 {
                font-size: 1.6rem;
                margin-bottom: 10px;
            }

            #final-image {
                width: 80%;
                margin: 15px 0;
            }

            #explanation {
                font-size: 0.95rem;
                padding: 14px;
                margin: 15px 0;
            }

            #stats {
                font-size: 1rem;
                margin: 5px 0;
            }

            #stars {
                font-size: 1.3rem;
                margin: 10px 0;
            }

            #credits-btn {
                width: 90%;
                font-size: 1rem;
                padding: 12px;
                border-radius: 10px;
            }
        }

        /* 🔹 Tablets (max-width: 1024px) */
        @media (max-width: 1024px) and (min-width: 601px) {
            #container {
                width: 85%;
            }

            h1 {
                font-size: 2.2rem;
            }

            #final-image {
                width: 55%;
            }

            #explanation {
                font-size: 1.05rem;
                padding: 18px;
            }

            #credits-btn {
                font-size: 1.1rem;
                padding: 14px 24px;
            }
        }

        /* 🔹 Small heights (less than 750px) */
        @media (max-height: 750px) {
            body {
                padding: 10px;
                justify-content: flex-start;
                /* Avoid vertical overflow */
            }

            #container {
                max-height: 90vh;
                overflow-y: auto;
                padding: 15px;
            }

            h1 {
                font-size: clamp(1rem, 3vh, 1.6rem);
                margin-bottom: 12px;
            }

            #final-image {
                width: min(45vw, 200px);
                margin: 10px 0;
            }

            #explanation {
                font-size: clamp(0.85rem, 2vh, 1rem);
                padding: 10px;
                margin: 10px 0;
            }

            #stats,
            #mode {
                font-size: clamp(0.85rem, 2vh, 1rem);
                margin: 5px 0;
            }

            #stars {
                font-size: clamp(1rem, 3vh, 1.5rem);
                margin: 5px 0;
            }

            #credits-btn {
                font-size: clamp(0.9rem, 2vh, 1rem);
                padding: 8px 16px;
                width: 80%;
                margin-top: 15px;
            }
        }

        /* --- Landscape Warning for Phones --- */
        @media screen and (orientation: landscape) and (max-width: 1024px) {
            body::before {
                content: "Please rotate your device to portrait mode 📱";
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 1);
                color: #fff;
                font-size: 1.4rem;
                font-family: 'Comfortaa', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                z-index: 99999;
                padding: 20px;
                box-sizing: border-box;
            }
        }
    </style>

    <script>
        "use strict";
        !function () {
            function detectDevTool(allow) {
                if (isNaN(+allow)) allow = 100;
                var start = +new Date();
                debugger;
                var end = +new Date();
                if (isNaN(start) || isNaN(end) || end - start > allow) {
                    consoleCheck();
                }
            }
            if (window.attachEvent) {
                if (document.readyState === "complete" || document.readyState === "interactive") {
                    detectDevTool();
                    window.attachEvent('onresize', detectDevTool);
                    window.attachEvent('onmousemove', detectDevTool);
                    window.attachEvent('onfocus', detectDevTool);
                    window.attachEvent('onblur', detectDevTool);
                    window.attachEvent('onkeydown', detectDevTool);
                    window.attachEvent('onkeyup', detectDevTool);
                    window.attachEvent('oncontextmenu', detectDevTool);
                    window.attachEvent('onscroll', detectDevTool);
                    window.attachEvent('onmousedown', detectDevTool);
                    window.attachEvent('onmouseup', detectDevTool);
                } else {
                    setTimeout(arguments.callee, 0);
                }
            } else {
                window.addEventListener('load', detectDevTool);
                window.addEventListener('resize', detectDevTool);
                window.addEventListener('mousemove', detectDevTool);
                window.addEventListener('focus', detectDevTool);
                window.addEventListener('blur', detectDevTool);
                window.addEventListener('keydown', detectDevTool);
                window.addEventListener('keyup', detectDevTool);
                window.addEventListener('contextmenu', detectDevTool);
                window.addEventListener('scroll', detectDevTool);
                window.addEventListener('mousedown', detectDevTool);
                window.addEventListener('mouseup', detectDevTool);
            }
        }();

        // Prevent opening the console using keyboard shortcuts
        document.addEventListener("keydown", function (e) {
            if (e.key === "F12" || (e.ctrlKey && (e.key === "u" || e.key === "s" || e.key === "i" || e.key === "c"))) {
                e.preventDefault();
            }
        });

        // Disable right-click context menu
        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        // Disable copy and paste
        document.addEventListener("copy", function (e) {
            e.preventDefault();
        });

        document.addEventListener("paste", function (e) {
            e.preventDefault();
        });

        // Disable text selection
        document.addEventListener("selectstart", function (e) {
            e.preventDefault();
        });

        // Disable context menu and certain keyboard shortcuts
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'F12' || (e.ctrlKey && (e.shiftKey && e.key === 'I'))) {
                e.preventDefault();
            }
        });

        // Disable copy (Ctrl+C), cut (Ctrl+X), and paste (Ctrl+V)
        if (e.ctrlKey && (e.key === 'c' || e.key === 'x' || e.key === 'v')) {
            e.preventDefault();
        }

        (function () {
            const devtools = /./;
            let devtoolsOpen = false; // Track if the dev tools are open

            devtools.toString = function () {
                devtoolsOpen = true; // Set flag to true if dev tools are opened
                consoleCheck(); // Trigger when dev tools are open
            };

            setInterval(function () {
                console.log('%c', devtools);
                if (devtoolsOpen) {
                    // Optional: if you want to do something when dev tools are open
                    consoleCheck();
                }
            }, 1000);

            function consoleCheck() {
                if (devtoolsOpen) {
                    alert('Please do not use Developer Tools!');
                    // Optionally, redirect or hide content
                    document.body.innerHTML = '<h1>Access Denied</h1>';
                }
            }
        })();

        function consoleCheck() {
            document.querySelector('body').innerHTML = 'We strongly support not using the console for extra actions! Please Refresh the page to Restart';
        }

    </script>
</head>

<body>
    <div id="container">
        <h1>🎉 Puzzle Completed! 🎉</h1>
        <div id="mode"></div>
        <img id="final-image" src="" alt="Completed Puzzle">
        <p id="explanation"></p>
        <p id="stats"></p>
        <div id="stars"></div>
        <button id="credits-btn">Exit</button>
    </div>

    <script>
        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get("mode");
            const folder = params.get("folder");
            const turns = params.get("turns");
            const stars = params.get("stars");
            const explanation = params.get("explanation");
            const minutes = params.get("minutes");
            const seconds = params.get("seconds");

            // Load content
            document.getElementById("final-image").src = `${mode}/${folder}/pic.jpg`;

            function capitalizeFirstLetter(word) {
                if (!word) return ""; // Handle empty or null input
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }
            let capitalizedWord = capitalizeFirstLetter(mode);


            document.getElementById("mode").innerText = `Mode: ${capitalizedWord}`;
            document.getElementById("explanation").innerText = explanation;
            document.getElementById("stats").innerText = `Turns: ${turns} | Time: ${minutes}:${seconds}`;
            document.getElementById("stars").innerText = ` You earned: ${stars} `;

            // Exit button
            document.getElementById("credits-btn").onclick = () => {
                window.location.href = "exit.html";
            };
        };
    </script>
</body>

</html>
