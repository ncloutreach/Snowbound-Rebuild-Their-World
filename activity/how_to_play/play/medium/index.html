    <script>
        "use strict";
        !function () {
            function detectDevTool(allow) {
                if (isNaN(+allow)) allow = 100;
                var start = +new Date();
                debugger;
                var end = +new Date();
                if (isNaN(start) || isNaN(end) || end - start > allow) {
                    consoleCheck();
                }
            }
            window.addEventListener('load', detectDevTool);
            ['resize', 'mousemove', 'focus', 'blur', 'keydown', 'contextmenu', 'scroll', 'mousedown', 'mouseup']
                .forEach(evt => window.addEventListener(evt, detectDevTool));
        }();

        document.addEventListener("keydown", function (e) {
            if (e.key === "F12" || (e.ctrlKey && (e.key === "u" || e.key === "s" || e.key === "i" || e.key === "c"))) {
                e.preventDefault();
            }
        });

        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("copy", e => e.preventDefault());
        document.addEventListener("paste", e => e.preventDefault());
        document.addEventListener("selectstart", e => e.preventDefault());

        function consoleCheck() {
            document.body.innerHTML =
                '<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;background:#000;color:#00bfff;text-align:center;"><h1>⚠️ Access Denied</h1><p>Please refresh to continue without using Developer Tools.</p></div>';
        }

        function startGame() {
            window.location.href = "../../../welcome.html";
        }
    </script>

        var isGameComplete = false; // Track game completion status

        var folderExplanations = {

        // Function to periodically display random facts in the fact-box
        function showFacts() {
            const factTextElement = document.getElementById("fact-text");

            function updateFact() {
                const randomIndex = Math.floor(Math.random() * facts.length);
                factTextElement.innerText = facts[randomIndex];
                // Restart animation
                factTextElement.style.animation = 'none';
                void factTextElement.offsetWidth; // Trigger reflow
                factTextElement.style.animation = 'scrollFacts 15s linear infinite';
            }

            updateFact();
            setInterval(updateFact, 15000); // Change fact every 15 seconds
        }


        // Add this function to check if the puzzle is complete
        function checkCompletion() {
            return correctPositions.every(position => position === true); // Ensure all positions are correct
        }

        // Function to show the original image, explanation, and stars after game completion
        function showCompletionScreen(selectedFolder) {
            const starRating = getStarRating(turns, minutes, seconds);
            const explanation = folderExplanations[selectedFolder];
            const mode = "medium";

            // Prepare data to send
            const params = new URLSearchParams({
                mode: mode,
                folder: selectedFolder,
                turns: turns,
                stars: starRating,
                explanation: explanation,
                minutes: minutes,
                seconds: seconds
            });

            // ✅ Redirect to completion page in parent folder with data

        // Function to calculate star rating based on both moves and timer
        function getStarRating(turns, minutes, seconds) {
            // Convert total time into seconds
            const totalTime = minutes * 60 + seconds;

            // Ideal benchmarks for 3x3 puzzle with question pop-ups
            const idealMoves = 40;   // 9 correct placements + some retries
            const idealTime = 150;   // ~2.5 minutes (since questions slow down play)

            // Calculate relative performance scores (capped at 1.0)
            const moveScore = Math.min(1, idealMoves / turns);
            const timeScore = Math.min(1, idealTime / totalTime);

            // Weighted average (moves = 60%, time = 40%)
            const finalScore = (moveScore * 0.6 + timeScore * 0.4) * 100;

            // Assign stars based on score
            if (finalScore >= 90) return "⭐⭐⭐⭐⭐"; // Perfect
            else if (finalScore >= 75) return "⭐⭐⭐⭐"; // Excellent
            else if (finalScore >= 55) return "⭐⭐⭐";  // Good
            else if (finalScore >= 35) return "⭐⭐";   // Fair
            else return "⭐";                          // Needs improvement
        }

        let seconds = 0;
        let minutes = 0;

        // Timer update function
        function updateTimer() {
            seconds++;
            if (seconds === 60) {
                seconds = 0;
                minutes++;
            }
            const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('timer').textContent = formattedTime;
        }

        // Start the timer with a 1-second interval
        const timerInterval = setInterval(updateTimer, 1000);

        // Function to stop the timer when the puzzle is completed (add your completion check logic)
        function stopTimer() {
            clearInterval(timerInterval);
        }

        window.onload = function () {
            selectedFolder = getRandomImageFolder();

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < columns; c++) {
                    let tile = document.createElement("img");
                    tile.src = "./images/blank2.jpg";
                    tile.id = `board-tile-${r}-${c}`;
                    tile.addEventListener("dragstart", dragStart);
                    tile.addEventListener("dragover", dragOver);
                    tile.addEventListener("dragenter", dragEnter);
                    tile.addEventListener("dragleave", dragLeave);
                    tile.addEventListener("drop", dragDrop);
                    tile.addEventListener("dragend", dragEnd);

                    // ✅ Touch events for mobile
                    tile.addEventListener("touchstart", touchStart, { passive: false });
                    tile.addEventListener("touchmove", touchMove, { passive: false });
                    tile.addEventListener("touchend", touchEnd, { passive: false });

                    document.getElementById("board").append(tile);
                }
            }

            //Pieces
            let pieces = [];
            for (let i = 1; i <= rows * columns; i++) {
                pieces.push(i.toString()); // // Put "1" to "16" into the array (puzzle image names)
            }
            pieces.reverse();

            // Shuffle the pieces
            for (let i = 0; i < pieces.length; i++) {
                let j = Math.floor(Math.random() * pieces.length);
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]]; // Shuffle
            }

            // Append shuffled pieces from the correct folder
            for (let i = 0; i < pieces.length; i++) {
                let tile = document.createElement("img");
                tile.src = `./${selectedFolder}/${pieces[i]}.jpg`;  // Use selected folder here


                tile.dataset.pieceNumber = pieces[i];

                // Drag functionality

                tile.addEventListener("dragover", dragOver);
                tile.addEventListener("dragenter", dragEnter);
                tile.addEventListener("dragleave", dragLeave);
                tile.addEventListener("drop", dragDrop);

            // If all questions have been used, reset the list

                usedQuestionIndices = [];

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * questions.length);

            usedQuestionIndices.push(randomIndex);

        let touchStartTile = null;

        function touchStart(e) {
            const target = e.target;
            if (target.dataset.locked === "true") return;
            touchStartTile = target;
            currTile = target;
            e.preventDefault();
        }

        function touchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.tagName === "IMG" && element !== touchStartTile) {
                otherTile = element;
            }
        }

        function touchEnd() {
            if (!touchStartTile || !otherTile) {
                touchStartTile = null;
                otherTile = null;
                currTile = null;
                return;
            }

            if (!currTile || !otherTile) return;
            if (currTile.src.includes("blank")) return;

            let currImg = currTile.src;
            let otherImg = otherTile.src;

            // ✅ Only allow placement if dropped on the puzzle board
            const droppedOnBoard = otherTile.parentElement.id === "board";

            if (droppedOnBoard && isCorrectPosition(otherTile, currTile)) {
                // Swap images
                currTile.src = otherImg;
                otherTile.src = currImg;

                // Mark the correct position and lock the tile
                const index = Array.prototype.indexOf.call(otherTile.parentNode.children, otherTile);
                correctPositions[index] = true;

                currTile.dataset.locked = "true";
                otherTile.dataset.locked = "true";

                // Play placement sound
                placementSound.play();

                // Update turn count

                document.getElementById("turns").innerText = turns;

                // Temporarily disable all tiles

                stopTimer();

                showCompletionScreen(selectedFolder);

            // 🔁 Reset references
            touchStartTile = null;
            otherTile = null;

        // Update the dragEnd function to check for game completion
        function dragEnd() {
            if (!otherTile || currTile.src.includes("blank")) return;

            let currImg = currTile.src;
            let otherImg = otherTile.src;

            // ✅ Only allow placement when dropped on the puzzle board
            const droppedOnBoard = otherTile.parentElement.id === "board";

            if (droppedOnBoard && isCorrectPosition(otherTile, currTile)) {
                // Swap images if valid

                // Reset the tile image (move back to pieces tray)
                currTile.src = `./${selectedFolder}/${currTile.dataset.pieceNumber}.jpg`;

            // ✅ Check for game completion after every valid move
            if (checkCompletion() && !isGameComplete) {
                stopTimer();
                isGameComplete = true;
                showCompletionScreen(selectedFolder);
            }

            // Reset drag references
            currTile = null;
            otherTile = null;
        }

        function isCorrectPosition(tile, draggedTile) {
            let tilePosition = Array.prototype.indexOf.call(tile.parentNode.children, tile);
            let draggedPosition = parseInt(draggedTile.dataset.pieceNumber) - 1; // Get the correct position from data attribute

            // Check if the position of the dragged tile matches the expected position
            return tilePosition === draggedPosition;
        }

        function isCorrectPosition(tile, draggedTile) {
            let tilePosition = Array.prototype.indexOf.call(tile.parentNode.children, tile);
            let draggedPosition = parseInt(draggedTile.dataset.pieceNumber) - 1; // Get the correct position from data attribute

            // Check if the position of the dragged tile matches the expected position

        function showQuestion(index) {
            let question = questions[index];
            let attemptsLeft = 3;
            let answeredCorrectly = false;

            const overlay = document.getElementById("overlay");
            const questionSection = document.getElementById("question-section");
            const closeBtn = document.getElementById("close-btn");
            const explanationBox = document.getElementById("explanation");
            const optionsDiv = document.getElementById("options");

            overlay.style.display = "block";
            questionSection.style.display = "block";
            closeBtn.style.display = "none";
            explanationBox.style.display = "none";

            // Smooth fade-in
            setTimeout(() => {
                overlay.style.opacity = 1;
                questionSection.style.transform = "translate(-50%, -50%) scale(1)";
                questionSection.style.opacity = 1;
            }, 50);

            document.getElementById("question").innerText = question.question;
            optionsDiv.innerHTML = '';

            question.options.forEach((option, i) => {
                let button = document.createElement("button");
                button.innerText = option;
                button.style.fontFamily = "Comfortaa";

                button.onclick = function () {
                    if (attemptsLeft <= 0 || answeredCorrectly) return;

                    attemptsLeft--;

                    if (i === question.correct) {
                        answeredCorrectly = true;

                        button.style.backgroundColor = "#88E788";
                        button.style.color = "black";

                        Array.from(optionsDiv.children).forEach(child => {
                            child.disabled = true;
                            if (child !== button) child.style.display = "none";
                        });

                        explanationBox.innerHTML = `
                    <strong>✅ Great job! You're making a difference for the planet! 🌍💚</strong><br><br>
                    ${question.explanation}
                `;
                        explanationBox.style.display = "block";
                        closeBtn.style.display = "block";

                    } else {
                        button.style.backgroundColor = "red";
                        button.style.color = "white";
                        button.disabled = true;

                        if (attemptsLeft === 0) {
                            Array.from(optionsDiv.children).forEach(child => {
                                child.disabled = true;
                                if (child !== optionsDiv.children[question.correct]) {
                                    child.style.display = "none";
                                } else {
                                    child.style.backgroundColor = "#88E788";
                                    child.style.color = "black";
                                }
                            });

                            explanationBox.innerHTML = `
                        <strong>❌ You got all attempts wrong 😢</strong><br><br>
                        ${question.explanation}
                    `;
                            explanationBox.style.display = "block";
                            closeBtn.style.display = "block";
                        }
                    }
                };

                optionsDiv.appendChild(button);
            });
        }
