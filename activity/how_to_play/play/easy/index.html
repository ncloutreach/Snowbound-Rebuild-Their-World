<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigsaw Puzzle</title>
    <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logo/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logo/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="logo/android-chrome-512x512.png">
    <link rel="manifest" href="/logo/site.webmanifest">
    <style>
        /* Body Styling */
        html {
            overflow: hidden;
        }

        .portal-scale {
            width: 100%;
            max-width: 1100px;
            /* prevents stretching */
            margin: 0 auto;
            transform-origin: top center;
        }

        body {
            font-family: 'Comfortaa';
            line-height: 1.6;
            color: #e0e0e0;
            background-color: #000000;
            margin: 0;
            padding: 0;
            padding-top: 5px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(40, 40, 40, 0.8) 0%, rgba(0, 0, 0, 0.8) 100%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M30,10 Q50,0 70,10 L90,30 Q100,50 90,70 L70,90 Q50,100 30,90 L10,70 Q0,50 10,30 Z" fill="rgba(60, 60, 60, 0.3)" /></svg>');
            background-size: cover, 100px 100px;
            background-position: center, center;
            background-repeat: no-repeat, repeat;
            animation: backgroundShift 30s linear infinite;
            overflow: hidden;
        }

        @keyframes backgroundShift {
            0% {
                background-position: center, 0 0;
            }

            100% {
                background-position: center, 100px 100px;
            }
        }

        h1 {
            color: white;
            /* Change text color */
            margin-top: 85px;
            /* Spacing below the title */
            font-size: 50px;
        }

        h2 {
            color: white;
            /* Change text color */
            margin-bottom: 20px;
            /* Spacing below the title */
            font-size: 30px;
        }

        /* 3x3 board version */
        #board {
            width: 250px;
            /* Adjusted for 3x3 tiles */
            height: 242px;
            /* Adjusted for 3x3 tiles */
            border: 2px solid transparent;
            transition: all 0.3s ease;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
        }

        #board img {
            width: 79px;
            height: 79px;
            border: 0.5px solid lightblue;
        }

        #pieces {
            width: 726px;
            height: 81px;
            border: 2px solid transparent;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }

        #pieces img {
            width: 79px;
            height: 79px;
            border: 0.5px solid lightblue;
        }

        /* Star rating style */
        .star-rating {
            font-size: 24px;
            color: gold;
            margin-top: 20px;
        }

        /* Overlay to disable board interaction */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            /* Semi-transparent black */
            backdrop-filter: blur(8px);
            /* Modern blur effect */
            z-index: 10;
            /* Above all other content */
            opacity: 0;
            /* Initial hidden state for fade-in */
            transition: opacity 0.5s ease;
            /* Smooth fade-in transition */
        }

        /* Question box styles */
        .question-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            /* Initial smaller scale for animation */
            width: 400px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            /* Rounded corners */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            /* Soft shadow for modern look */
            z-index: 11;
            /* Above the overlay */
            text-align: center;
            opacity: 0;
            /* Initial hidden state for fade-in */
            transition: transform 0.3s ease, opacity 0.3s ease;
            /* Smooth zoom and fade-in transition */
        }

        #question-section h3 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #333;
        }


        /* Options button styling */
        #options button {
            margin: 10px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #6200ea;
            /* Modern purple background */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Comfortaa', Arial, Helvetica, sans-serif;
            transition: background-color 0.3s ease, transform 0.2s ease;
            /* Hover effects */
        }

        #options button:hover {
            background-color: #4b00b5;
            /* Darker on hover */
            transform: translateY(-3px);
            /* Subtle lift on hover */
        }

        #options button:active {
            transform: scale(0.95);
            /* Shrink on click */
        }

        /* Explanation text */
        #explanation {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            line-height: 1.5;
            display: none;
        }

        /* New Fact Box Styles */
        #fact-box {
            width: 100%;
            overflow: hidden;
            /* Hide overflow */
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            font-family: 'Comfortaa', sans-serif;
        }

        #fact-text {
            display: inline-block;
            white-space: nowrap;
            /* Prevent wrapping */
            font-size: 18px;
            padding-left: 100%;
            /* Start off-screen */
            animation: scrollFacts 15s linear infinite;
            /* Scroll animation */
        }

        /* Scroll animation from right to left */
        @keyframes scrollFacts {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        #timer {
            position: fixed;
            top: 100px;
            left: 10px;
            font-size: 24px;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 8px;
            font-family: 'Comfortaa', sans-serif;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        /* Close Button Styling */
        #close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            z-index: 1001;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        #close-btn:hover {
            color: #ff3333 !important;
            transform: rotate(90deg) scale(1.2);
        }

        #explanation {
            margin-top: 24px;
            font-size: 18px;
            color: #1a1a1a;
            background: linear-gradient(135deg, #fffbe6, #fff3cd);
            border-left: 6px solid #ffca28;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.7;
            display: none;
            animation: fadeInPop 0.4s ease forwards;
            font-family: 'Comfortaa', sans-serif;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            position: relative;
            transition: all 0.3s ease;
        }

        @keyframes fadeInPop {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        #explanation::before {
            content: '';
            position: absolute;
            top: 16px;
            left: -10px;
            width: 8px;
            height: 8px;
            background-color: #ffc107;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffc107aa, 0 0 20px #ffc10788;
        }

        #control-buttons {
            position: fixed;
            top: 100px;
            right: 30px;
            display: flex;
            gap: 15px;
            /* space between buttons */
            justify-content: center;
            /* center horizontally */
        }

        #control-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            font-family: 'Comfortaa', sans-serif;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #FFD700;
            color: black;
            transition: all 0.3s ease;
        }

        #control-buttons button:hover {
            background-color: #FFC107;
            transform: scale(1.05);
        }

        #control-buttons button:active {
            transform: scale(0.95);
        }

        /* === RESPONSIVE DESIGN === */

        /* --- Foldable Phones: max-width 390px --- */
        @media (max-width: 390px) {

            body {
                padding-top: 60px;

            }

            /* Smaller puzzle board */
            #board {
                width: 150px;

            #board img {

                height: 47px;
            }

            /* Pieces container below board */
            #pieces {

                height: auto;
                justify-content: center;
                margin-top: 8px;
            }

            #pieces img {
                width: 47px;
                height: 47px;
            }

            /* Timer smaller and near top */
            #timer {
                top: 60px;
                left: 8px;
                font-size: 14px;
                padding: 4px 6px;
            }

            /* Move Home and Exit buttons to bottom */
            /* Bottom bar for buttons (non-blocking) */
            #control-buttons {
                position: fixed;
                bottom: 0;
                /* Stick to screen bottom */
                left: 0;
                width: 100%;
                height: 50px;
                background: rgba(0, 0, 0, 0.4);
                /* Semi-transparent bar */
                backdrop-filter: blur(6px);
                display: flex;
                justify-content: space-evenly;
                align-items: center;
                gap: 10px;
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                z-index: 999;
                padding: 6px 0;
            }

            #control-buttons button {
                margin-top: 5px;
                font-size: 14px;
                padding: 8px 16px;
                background-color: #FFD700;
                border-radius: 8px;
            }

            #control-buttons button:hover {
                background-color: #FFC107;
                transform: scale(1.05);
            }

            /* Fact box text smaller */
            #fact-text {
                font-size: 12px;
            }

            /* Question box fits narrow screen */
            .question-box {
                width: 90%;
                padding: 12px;
            }

            #options button {
                font-size: 14px;
                padding: 8px 14px;
            }
        }

        /* --- Mobile: max-width 600px --- */
        @media (max-width: 600px) {

            h1 {
                font-size: 28px;
                margin-top: 100px;
            }

            h2 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            /* Smaller board */
            #board {
                width: 180px;
                height: 174px;
            }

            #board img {
                width: 58px;
                height: 58px;
            }

            /* Smaller pieces row */
            #pieces {
                width: 270px;
                height: auto;
                justify-content: center;
            }

            #pieces img {
                width: 58px;
                height: 58px;
            }

            /* Timer smaller and repositioned */
            #timer {
                top: 70px;
                left: 10px;
                font-size: 18px;
                padding: 4px 8px;
            }

            /* Home/Exit buttons smaller, moved closer */
            #control-buttons {
                top: 70px;
                right: 10px;
                flex-direction: column;
                gap: 8px;
            }

            #control-buttons button {
                font-size: 14px;
                padding: 6px 12px;
            }

            /* Question Box smaller */
            .question-box {
                width: 90%;
                padding: 15px;
            }

            #fact-text {
                font-size: 14px;
            }
        }

        /* --- Tablet: max-width 1024px --- */
        @media (max-width: 1024px) and (min-width: 601px) {

            h1 {
                font-size: 40px;
            }

            h2 {
                font-size: 22px;
            }

            #board {
                width: 220px;
                height: 214px;
            }

            #board img {
                width: 70px;
                height: 70px;
            }

            #pieces {
                width: 450px;
                height: 75px;
                justify-content: center;
            }

            #pieces img {
                width: 70px;
                height: 70px;
            }

            #timer {
                font-size: 20px;
                top: 80px;
                left: 15px;
            }

            #control-buttons {
                top: 105px;
                right: 20px;
                gap: 12px;
            }

            #control-buttons button {
                font-size: 15px;
                padding: 8px 16px;
            }

            .question-box {
                width: 80%;
            }
        }

        /* --- Desktop: max-width 1440px (default fine-tune) --- */
        @media (max-width: 1440px) and (min-width: 1025px) {
            #board {
                width: 250px;
                height: 242px;
            }

            #board img {
                width: 79px;
                height: 79px;
            }

            #pieces {
                width: 726px;
                height: 81px;
            }

            #pieces img {
                width: 79px;
                height: 79px;
            }

            #timer {
                font-size: 22px;
                top: 90px;
                left: 20px;
            }

            #control-buttons {
                top: 90px;
                right: 25px;
            }

            #control-buttons button {
                font-size: 16px;
                padding: 10px 18px;
            }
        }

        /* --- Landscape Warning for Phones --- */
        @media screen and (orientation: landscape) and (max-width: 1024px) {
            body::before {
                content: "Please rotate your device to portrait mode 📱";
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 1);
                color: #fff;
                font-size: 1.4rem;
                font-family: 'Comfortaa', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                z-index: 99999;
                padding: 20px;
                box-sizing: border-box;
            }
        }
    </style>

    <script>
        "use strict";
        !function () {
            function detectDevTool(allow) {
                if (isNaN(+allow)) allow = 100;
                var start = +new Date();
                debugger;
                var end = +new Date();
                if (isNaN(start) || isNaN(end) || end - start > allow) {
                    consoleCheck();
                }
            }
            if (window.attachEvent) {
                if (document.readyState === "complete" || document.readyState === "interactive") {
                    detectDevTool();
                    window.attachEvent('onresize', detectDevTool);
                    window.attachEvent('onmousemove', detectDevTool);
                    window.attachEvent('onfocus', detectDevTool);
                    window.attachEvent('onblur', detectDevTool);
                    window.attachEvent('onkeydown', detectDevTool);
                    window.attachEvent('onkeyup', detectDevTool);
                    window.attachEvent('oncontextmenu', detectDevTool);
                    window.attachEvent('onscroll', detectDevTool);
                    window.attachEvent('onmousedown', detectDevTool);
                    window.attachEvent('onmouseup', detectDevTool);
                } else {
                    setTimeout(arguments.callee, 0);
                }
            } else {
                window.addEventListener('load', detectDevTool);
                window.addEventListener('resize', detectDevTool);
                window.addEventListener('mousemove', detectDevTool);
                window.addEventListener('focus', detectDevTool);
                window.addEventListener('blur', detectDevTool);
                window.addEventListener('keydown', detectDevTool);
                window.addEventListener('keyup', detectDevTool);
                window.addEventListener('contextmenu', detectDevTool);
                window.addEventListener('scroll', detectDevTool);
                window.addEventListener('mousedown', detectDevTool);
                window.addEventListener('mouseup', detectDevTool);
            }
        }();

        // Prevent opening the console using keyboard shortcuts
        document.addEventListener("keydown", function (e) {
            if (e.key === "F12" || (e.ctrlKey && (e.key === "u" || e.key === "s" || e.key === "i" || e.key === "c"))) {
                e.preventDefault();
            }
        });

        // Disable right-click context menu
        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        // Disable copy and paste
        document.addEventListener("copy", function (e) {
            e.preventDefault();
        });

        document.addEventListener("paste", function (e) {
            e.preventDefault();
        });

        // Disable text selection
        document.addEventListener("selectstart", function (e) {
            e.preventDefault();
        });

        // Disable context menu and certain keyboard shortcuts
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'F12' || (e.ctrlKey && (e.shiftKey && e.key === 'I'))) {
                e.preventDefault();
            }
        });

        // Disable copy (Ctrl+C), cut (Ctrl+X), and paste (Ctrl+V)
        if (e.ctrlKey && (e.key === 'c' || e.key === 'x' || e.key === 'v')) {
            e.preventDefault();
        }

        (function () {
            const devtools = /./;
            let devtoolsOpen = false; // Track if the dev tools are open

            devtools.toString = function () {
                devtoolsOpen = true; // Set flag to true if dev tools are opened
                consoleCheck(); // Trigger when dev tools are open
            };

            setInterval(function () {
                console.log('%c', devtools);
                if (devtoolsOpen) {
                    // Optional: if you want to do something when dev tools are open
                    consoleCheck();
                }
            }, 1000);

            function consoleCheck() {
                if (devtoolsOpen) {
                    alert('Please do not use Developer Tools!');
                    // Optionally, redirect or hide content
                    document.body.innerHTML = '<h1>Access Denied</h1>';
                }
            }
        })();

        function consoleCheck() {
            document.querySelector('body').innerHTML = 'We strongly support not using the console for extra actions! Please Refresh the page to Restart';
        }

    </script>

</head>

<body>
    <div class="portal-scale">
        <h1>Easy Mode</h1> <!-- Title added here -->
        <br>
        <div id="board"></div>
        <h2>Turns: <span id="turns">0</span></h2>
        <div id="pieces"></div>

        <!-- Overlay to disable interaction with the board -->
        <div id="overlay" style="display: none;"></div>

        <!-- Question Section with a background box and Close Button -->
        <div id="question-section" class="question-box"
            style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); opacity: 0; transition: all 0.5s ease; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;">
            <button id="close-btn"
                style="position: absolute; top: 10px; right: 15px; background: transparent; border: none; font-size: 24px; cursor: pointer; color: #333; font-weight: bold; z-index: 1001;">&times;</button>
            <h3 id="question"></h3>
            <div id="options"></div>
            <p id="explanation" style="display: none;"></p>
        </div>

        <!-- New Fact Box -->
        <div id="fact-box">
            <p id="fact-text">Loading fact...</p>
        </div>

        <div id="timer">00:00</div>
        <link rel="shortcut icon" href="#">

        <div id="control-buttons">
            <button id="home-btn">🏠 Home</button>
            <button id="exit-btn">❌ Exit</button>
        </div>
    </div>

    <script>
        var rows = 3;
        var columns = 3;

        var currTile;
        var otherTile;
        var turns = 0;
        var isGameComplete = false; // Track game completion status

        var folderExplanations = {
            "images": "This is a polar bear in the Arctic, struggling due to the melting sea ice.",
            "images2": "This is an endangered penguin colony, affected by changes in the Antarctic ecosystem.",
            "images3": "This image shows the rapid retreat of glaciers due to climate change.",
            "images4": "Melting icebergs like this contribute to rising sea levels.",
            "images5": "Polar bears rely on these icy hunting grounds, which are vanishing due to global warming.",
            "images6": "A polar bear wanders through a barren landscape, highlighting the devastating impact of climate change on Arctic habitats."
        };

        const facts = [
            "Arctic sea ice is declining at a rate of 13% per decade.",
            "Polar bears are listed as a vulnerable species due to climate change.",
            "The Arctic is warming twice as fast as the global average.",
            "Polar bears primarily hunt seals from sea ice platforms.",
            "Climate change is causing longer ice-free periods in the Arctic.",
            "Polar bears can swim for long distances, but this uses a lot of energy.",
            "The Arctic could be ice-free in summer by 2040.",
            "Polar bears are considered marine mammals because they spend most of their time on sea ice.",
            "Climate change affects the entire Arctic ecosystem, not just polar bears.",
            "Reducing carbon emissions is crucial for protecting Arctic habitats.",
            "Earth's temperature has risen 1.2°C since the 1800s.",
            "Oceans absorb 90% of heat, raising sea levels.",
            "The Arctic warms twice as fast, melting ice.",
            "Deforestation adds 10% of greenhouse gases.",
            "Extreme weather events are intensifying.",
            "Renewable energy is key to climate action.",
            "CO₂ levels are 50% higher than pre-industrial times.",
            "Climate change could displace 1 billion by 2050.",
            "Coral reefs face bleaching due to warm seas.",
            "Melting glaciers raise global sea levels.",
            "Air pollution and climate change are linked.",
            "Forests absorb a third of CO₂ emissions.",
            "Species face extinction as habitats shift.",
            "Crop yields may drop 30% by 2050.",
            "The Paris Agreement seeks a 1.5°C cap."
        ];

        // Function to periodically display random facts in the fact-box
        function showFacts() {
            const factTextElement = document.getElementById("fact-text");

            function updateFact() {
                const randomIndex = Math.floor(Math.random() * facts.length);
                factTextElement.innerText = facts[randomIndex];
                // Restart animation
                factTextElement.style.animation = 'none';
                void factTextElement.offsetWidth; // Trigger reflow
                factTextElement.style.animation = 'scrollFacts 15s linear infinite';
            }

            updateFact();
            setInterval(updateFact, 15000); // Change fact every 15 seconds
        }

        // Add this function to check if the puzzle is complete
        function checkCompletion() {
            return correctPositions.every(position => position === true); // Ensure all positions are correct
        }

        // Function to show the original image, explanation, and stars after game completion
        function showCompletionScreen(selectedFolder) {
            const starRating = getStarRating(turns, minutes, seconds);
            const explanation = folderExplanations[selectedFolder];
            const mode = "easy";

            // Prepare data to send
            const params = new URLSearchParams({
                mode: mode,
                folder: selectedFolder,
                turns: turns,
                stars: starRating,
                explanation: explanation,
                minutes: minutes,
                seconds: seconds
            });

            // ✅ Redirect to completion page in parent folder with data
            window.location.href = `../completion.html?${params.toString()}`;
        }

        // Function to calculate star rating based on both moves and timer
        function getStarRating(turns, minutes, seconds) {
            // Convert total time into seconds
            const totalTime = minutes * 60 + seconds;

            // Ideal benchmarks for 3x3 puzzle with question pop-ups
            const idealMoves = 18;   // 9 correct placements + some retries
            const idealTime = 150;   // ~2.5 minutes (since questions slow down play)

            // Calculate relative performance scores (capped at 1.0)
            const moveScore = Math.min(1, idealMoves / turns);
            const timeScore = Math.min(1, idealTime / totalTime);

            // Weighted average (moves = 60%, time = 40%)
            const finalScore = (moveScore * 0.6 + timeScore * 0.4) * 100;

            // Assign stars based on score
            if (finalScore >= 90) return "⭐⭐⭐⭐⭐"; // Perfect
            else if (finalScore >= 75) return "⭐⭐⭐⭐"; // Excellent
            else if (finalScore >= 55) return "⭐⭐⭐";  // Good
            else if (finalScore >= 35) return "⭐⭐";   // Fair
            else return "⭐";                          // Needs improvement
        }



        var questions = [

        function getRandomImageFolder() {
            const folders = ["images", "images2", "images3", "images4", "images5", "images6"];
            const randomIndex = Math.floor(Math.random() * folders.length);
            return folders[randomIndex];
        }
        var selectedFolder;

        // For tracking correct placement of pieces
        var correctPositions = Array(rows * columns).fill(false);

        // Initialize timer variables
        let seconds = 0;
        let minutes = 0;

        // Timer update function
        function updateTimer() {
            seconds++;
            if (seconds === 60) {
                seconds = 0;
                minutes++;
            }
            const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('timer').textContent = formattedTime;
        }

        // Start the timer with a 1-second interval
        const timerInterval = setInterval(updateTimer, 1000);

        // Function to stop the timer when the puzzle is completed (add your completion check logic)
        function stopTimer() {
            clearInterval(timerInterval);
        }

        // Load the selected image folder when the page loads
        window.onload = function () {

            selectedFolder = getRandomImageFolder();


            // Initialize the 3x3 board
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < columns; c++) {
                    let tile = document.createElement("img");
                    tile.src = `./${selectedFolder}/blank2.jpg`;  // Correct folder for blank image
                    tile.id = `board-tile-${r}-${c}`;

                    // Drag functionality
                    tile.addEventListener("dragstart", dragStart);
                    tile.addEventListener("dragover", dragOver);
                    tile.addEventListener("dragenter", dragEnter);
                    tile.addEventListener("dragleave", dragLeave);
                    tile.addEventListener("drop", dragDrop);
                    tile.addEventListener("dragend", dragEnd);

                    // ✅ Touch events for mobile
                    tile.addEventListener("touchstart", touchStart, { passive: false });
                    tile.addEventListener("touchmove", touchMove, { passive: false });
                    tile.addEventListener("touchend", touchEnd, { passive: false });

                    document.getElementById("board").append(tile);
                }
            }

            // Pieces
            let pieces = [];
            for (let i = 1; i <= rows * columns; i++) {
                pieces.push(i.toString()); // Put "1" to "25" into the array (puzzle image names)
            }
            pieces.reverse();

            // Shuffle the pieces
            for (let i = 0; i < pieces.length; i++) {
                let j = Math.floor(Math.random() * pieces.length);
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]]; // Swap pieces
            }

            // Append shuffled pieces from the correct folder
            for (let i = 0; i < pieces.length; i++) {
                let tile = document.createElement("img");
                tile.src = `./${selectedFolder}/${pieces[i]}.jpg`;  // Use selected folder here


                tile.dataset.pieceNumber = pieces[i];

                // Drag functionality
                tile.addEventListener("dragstart", dragStart);
                tile.addEventListener("dragover", dragOver);
                tile.addEventListener("dragenter", dragEnter);
                tile.addEventListener("dragleave", dragLeave);
                tile.addEventListener("drop", dragDrop);
                tile.addEventListener("dragend", dragEnd);

                // ✅ Touch events for mobile
                tile.addEventListener("touchstart", touchStart, { passive: false });
                tile.addEventListener("touchmove", touchMove, { passive: false });
                tile.addEventListener("touchend", touchEnd, { passive: false });

                document.getElementById("pieces").append(tile);
            }

            // Start displaying facts
            showFacts();
        }



        // Keep track of used question indices
        let usedQuestionIndices = [];

        // Function to get a random question without repetition
        function getRandomQuestionIndex() {
            // If all questions have been used, reset the list
            if (usedQuestionIndices.length === questions.length) {
                usedQuestionIndices = [];
            }

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * questions.length);
            } while (usedQuestionIndices.includes(randomIndex));

            usedQuestionIndices.push(randomIndex);
            return randomIndex;
        }

        let touchStartTile = null;

        function touchStart(e) {
            const target = e.target;
            if (target.dataset.locked === "true") return;
            touchStartTile = target;
            currTile = target;
            e.preventDefault();
        }

        function touchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.tagName === "IMG" && element !== touchStartTile) {
                otherTile = element;
            }
        }

        function touchEnd() {
            if (!touchStartTile || !otherTile) {
                touchStartTile = null;
                otherTile = null;
                currTile = null;
                return;
            }

            if (!currTile || !otherTile) return;
            if (currTile.src.includes("blank")) return;

            let currImg = currTile.src;
            let otherImg = otherTile.src;

            // ✅ Only allow placement if dropped on the puzzle board
            const droppedOnBoard = otherTile.parentElement.id === "board";

            if (droppedOnBoard && isCorrectPosition(otherTile, currTile)) {
                // Swap images
                currTile.src = otherImg;
                otherTile.src = currImg;

                // Mark the correct position and lock the tile
                const index = Array.prototype.indexOf.call(otherTile.parentNode.children, otherTile);
                correctPositions[index] = true;

                currTile.dataset.locked = "true";
                otherTile.dataset.locked = "true";

                // Play placement sound
                placementSound.play();

                // Update turn count
                turns += 1;
                document.getElementById("turns").innerText = turns;

                // Temporarily disable all tiles
                const tiles = document.querySelectorAll("#board img, #pieces img");
                tiles.forEach(tile => tile.style.pointerEvents = "none");

                // Show a random question after delay
                const pieceIndex = getRandomQuestionIndex();
                setTimeout(() => {
                    showQuestion(pieceIndex);
                    tiles.forEach(tile => tile.style.pointerEvents = "auto");
                }, 1500);

            } else {
                // ❌ Invalid placement (either not on board or incorrect)
                turns += 1;
                document.getElementById("turns").innerText = turns;

                // Reset the piece image
                currTile.src = `./${selectedFolder}/${currTile.dataset.pieceNumber}.jpg`;
            }

            // ✅ Check for completion
            if (checkCompletion() && !isGameComplete) {
                stopTimer();
                isGameComplete = true;
                showCompletionScreen(selectedFolder);
            }

            // 🔁 Reset references
            touchStartTile = null;
            otherTile = null;
            currTile = null;
        }


        // Dragging functions
        function dragStart() {
            if (this.dataset.locked === "true") {
                return; // Prevent dragging if the tile is locked
            }
            currTile = this;
        }

        function dragOver(e) {
            e.preventDefault();
        }

        function dragEnter(e) {
            e.preventDefault();
        }

        function dragLeave() { }

        function dragDrop() {
            otherTile = this;
        }

        // Preload the placement sound
        const placementSound = new Audio('./src_assets_puzzle.wav');

        // Update the dragEnd function to check for game completion
        function dragEnd() {
            if (!otherTile || currTile.src.includes("blank")) return;

            let currImg = currTile.src;
            let otherImg = otherTile.src;

            // ✅ Only allow placement when dropped on the puzzle board
            const droppedOnBoard = otherTile.parentElement.id === "board";

            if (droppedOnBoard && isCorrectPosition(otherTile, currTile)) {
                // Swap images if valid
                currTile.src = otherImg;
                otherTile.src = currImg;

                // Mark the correct position and lock the tile
                let index = Array.prototype.indexOf.call(otherTile.parentNode.children, otherTile);
                correctPositions[index] = true;

                // Lock both tiles to prevent further moves
                currTile.dataset.locked = "true";
                otherTile.dataset.locked = "true";

                // Play placement sound
                placementSound.play();

                // Increment turns
                turns += 1;
                document.getElementById("turns").innerText = turns;

                // Temporarily disable all tiles
                const tiles = document.querySelectorAll("#board img, #pieces img");
                tiles.forEach(tile => tile.style.pointerEvents = "none");

                // Show a random question after 1.5s delay
                let pieceIndex = getRandomQuestionIndex();
                setTimeout(() => {
                    showQuestion(pieceIndex);

                    // Re-enable all tiles
                    tiles.forEach(tile => tile.style.pointerEvents = "auto");
                }, 1500);

            } else {
                // ❌ Invalid placement (either not on board or incorrect)
                turns += 1;
                document.getElementById("turns").innerText = turns;

                // Reset the tile image (move back to pieces tray)
                currTile.src = `./${selectedFolder}/${currTile.dataset.pieceNumber}.jpg`;
            }

            // ✅ Check for game completion after every valid move
            if (checkCompletion() && !isGameComplete) {
                stopTimer();
                isGameComplete = true;
                showCompletionScreen(selectedFolder);
            }

            // Reset drag references
            currTile = null;
            otherTile = null;
        }


        function isCorrectPosition(tile, draggedTile) {
            let tilePosition = Array.prototype.indexOf.call(tile.parentNode.children, tile);
            let draggedPosition = parseInt(draggedTile.dataset.pieceNumber) - 1; // Get the correct position from data attribute

            // Check if the position of the dragged tile matches the expected position
            return tilePosition === draggedPosition;
        }

        function isCorrectPosition(tile, draggedTile) {
            let tilePosition = Array.prototype.indexOf.call(tile.parentNode.children, tile);
            let draggedPosition = parseInt(draggedTile.dataset.pieceNumber) - 1; // Get the correct position from data attribute

            // Check if the position of the dragged tile matches the expected position
            return tilePosition === draggedPosition;
        }

        function showQuestion(index) {
            let question = questions[index];
            let attemptsLeft = 3;
            let answeredCorrectly = false;

            const overlay = document.getElementById("overlay");
            const questionSection = document.getElementById("question-section");
            const closeBtn = document.getElementById("close-btn");
            const explanationBox = document.getElementById("explanation");
            const optionsDiv = document.getElementById("options");

            overlay.style.display = "block";
            questionSection.style.display = "block";
            closeBtn.style.display = "none";
            explanationBox.style.display = "none";

            // Smooth fade-in
            setTimeout(() => {
                overlay.style.opacity = 1;
                questionSection.style.transform = "translate(-50%, -50%) scale(1)";
                questionSection.style.opacity = 1;
            }, 50);

            document.getElementById("question").innerText = question.question;
            optionsDiv.innerHTML = '';

            question.options.forEach((option, i) => {
                let button = document.createElement("button");
                button.innerText = option;
                button.style.fontFamily = "Comfortaa";

                button.onclick = function () {
                    if (attemptsLeft <= 0 || answeredCorrectly) return;

                    attemptsLeft--;

                    if (i === question.correct) {
                        answeredCorrectly = true;

                        button.style.backgroundColor = "#88E788";
                        button.style.color = "black";

                        Array.from(optionsDiv.children).forEach(child => {
                            child.disabled = true;
                            if (child !== button) child.style.display = "none";
                        });

                        explanationBox.innerHTML = `
                    <strong>✅ Great job! You're making a difference for the planet! 🌍💚</strong><br><br>
                    ${question.explanation}
                `;
                        explanationBox.style.display = "block";
                        closeBtn.style.display = "block";

                    } else {
                        button.style.backgroundColor = "red";
                        button.style.color = "white";
                        button.disabled = true;

                        if (attemptsLeft === 0) {
                            Array.from(optionsDiv.children).forEach(child => {
                                child.disabled = true;
                                if (child !== optionsDiv.children[question.correct]) {
                                    child.style.display = "none";
                                } else {
                                    child.style.backgroundColor = "#88E788";
                                    child.style.color = "black";
                                }
                            });

                            explanationBox.innerHTML = `
                        <strong>❌ You got all attempts wrong 😢</strong><br><br>
                        ${question.explanation}
                    `;
                            explanationBox.style.display = "block";
                            closeBtn.style.display = "block";
                        }
                    }
                };

                optionsDiv.appendChild(button);
            });
        }


        // ✅ Close button functionality (keep this outside showQuestion)
        document.getElementById("close-btn").onclick = function () {
            const overlay = document.getElementById("overlay");
            const questionSection = document.getElementById("question-section");

            overlay.style.opacity = 0;
            questionSection.style.transform = "translate(-50%, -50%) scale(0.8)";
            questionSection.style.opacity = 0;

            setTimeout(() => {
                overlay.style.display = "none";
                questionSection.style.display = "none";
                document.getElementById("explanation").style.display = "none";

                // ✅ Hide the close button again
                document.getElementById("close-btn").style.display = "none";
            }, 500);
        };

        document.getElementById("home-btn").onclick = () => {
            window.location.href = "../start.html";
        };

        document.getElementById("exit-btn").onclick = () => {

            // If this doesn’t work in some browsers, you can also redirect to a "Thank you" page:
            window.location.href = "../exit.html";
        };

    </script>
