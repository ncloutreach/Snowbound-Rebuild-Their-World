<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logo/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logo/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="logo/android-chrome-512x512.png">
    <link rel="manifest" href="/logo/site.webmanifest">

    <style>
        /* General styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .portal-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Title styling (hidden on desktop by default) */
        .game-title {
            display: none;
            font-family: 'Fredoka', 'Comfortaa', Arial, sans-serif;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 8px #ff0000, 0 0 16px #ff0000;
            margin-bottom: 40px;
        }

        /* Background image for the welcome screen (Desktop only) */
        /* Default (Desktop) */
        /* FIXED welcome screen */
        .welcome-screen {
            width: 100%;
            max-width: 1200px;
            /* prevents stretch */
            min-height: 600px;
            /* safe height */
            padding: 20px;

            background-image: url('assets/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* Button container styling */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Default button sizes for desktop */
        .image-button {
            background: url('assets/button-image.png') no-repeat center center;
            background-size: contain;
            border: none;
            width: 230px;
            height: 100px;
            cursor: pointer;
            margin-top: 70px;
            display: block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #how-to-play-btn {
            background: url('assets/How_to_play.png') no-repeat center center;
            background-size: contain;
            width: 316px;
            height: 101px;
        }

        /* Hover effect */
        .image-button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        /* ========================= */
        /* RESPONSIVENESS */
        /* ========================= */

        /* --- Tablets (landscape & portrait) --- */
        @media (max-width: 1024px) {
            .welcome-screen {
                background-image: none !important;
                background: linear-gradient(135deg, #000000 0%, #1a001a 100%) !important;
                background-attachment: fixed !important;
                background-size: cover !important;
                background-position: center !important;
                background-repeat: no-repeat !important;
            }

            .game-title {
                display: block;
                font-size: 2.3rem;
                margin-top: -40px;
            }

            .image-button {
                width: 200px;
                height: 100px;
                margin-top: 70px;
            }

            #how-to-play-btn {
                width: 250px;
                height: 80px;
                margin-top: 7px;
            }
        }

        /* --- Large mobiles (portrait) --- */
        @media (max-width: 768px) {
            .welcome-screen {
                background-image: none !important;
                background: linear-gradient(135deg, #000000 0%, #1a001a 100%) !important;
                background-attachment: fixed !important;
                background-size: cover !important;
                background-position: center !important;
                background-repeat: no-repeat !important;
            }

            .game-title {
                display: block;
                font-size: 2rem;
                margin-top: -10px;
                padding: 0 20px;
            }

            .image-button {
                width: 170px;
                height: 70px;
                margin-top: 50px;
            }

            #how-to-play-btn {
                width: 230px;
                height: 75px;
            }
        }

        /* --- Small mobiles --- */
        @media (max-width: 480px) {
            .welcome-screen {
                background-image: none !important;
                background: linear-gradient(135deg, #000000 0%, #1a001a 100%) !important;
                background-attachment: fixed !important;
                background-size: cover !important;
                background-position: center !important;
                background-repeat: no-repeat !important;
            }

            .game-title {
                display: block;
                font-size: 1.6rem;
                line-height: 1.3;
                margin-top: 40px;
                padding: 0 25px;
            }

            .image-button {
                width: 140px;
                height: 60px;
                margin-top: 60px;
            }

            #how-to-play-btn {
                width: 190px;
                height: 65px;
            }
        }

        /* --- Landscape Warning for Phones --- */
        @media screen and (orientation: landscape) and (max-width: 1024px) {
            body::before {
                content: "Please rotate your device to portrait mode 📱";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 1);
                color: #fff;
                font-size: 1.4rem;
                font-family: 'Comfortaa', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                z-index: 99999;
                padding: 20px;
                box-sizing: border-box;
            }
        }
    </style>

    <script>
        "use strict";
        !function () {
            function detectDevTool(allow) {
                if (isNaN(+allow)) allow = 100;
                var start = +new Date();
                debugger;
                var end = +new Date();
                if (isNaN(start) || isNaN(end) || end - start > allow) {
                    consoleCheck();
                }
            }
            window.addEventListener('load', detectDevTool);
            ['resize', 'mousemove', 'focus', 'blur', 'keydown', 'contextmenu', 'scroll', 'mousedown', 'mouseup']
                .forEach(evt => window.addEventListener(evt, detectDevTool));
        }();

        document.addEventListener("keydown", function (e) {
            if (e.key === "F12" || (e.ctrlKey && (e.key === "u" || e.key === "s" || e.key === "i" || e.key === "c"))) {
                e.preventDefault();
            }
        });

        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("copy", e => e.preventDefault());
        document.addEventListener("paste", e => e.preventDefault());
        document.addEventListener("selectstart", e => e.preventDefault());

        function consoleCheck() {
            document.body.innerHTML =
                '<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;font-family:sans-serif;background:#000;color:#00bfff;text-align:center;"><h1>⚠️ Access Denied</h1><p>Please refresh to continue without using Developer Tools.</p></div>';
        }

        function startGame() {
            window.location.href = "../../../welcome.html";
        }
    </script>

</head>

<body>
    <div class="portal-wrapper">
        <div class="welcome-screen">
            <h1 class="game-title">Snowbound: Rebuild Their World</h1>
            <div class="button-container">
                <button id="play-btn" class="image-button"></button>
                <button id="how-to-play-btn" class="image-button"></button>
            </div>
        </div>
    </div>
    <script>
        // Redirecting to different HTML pages when buttons are clicked
        document.getElementById('play-btn').addEventListener('click', function () {
            window.location.href = 'how_to_play/play/start.html'; // Link to the play.html inside the 'play' folder
        });

        document.getElementById('how-to-play-btn').addEventListener('click', function () {
            window.location.href = 'how_to_play/how-to-play.html'; // Link to the how-to-play.html inside the 'how_to_play' folder
        });

    </script>
</body>

</html>
